name: Aurora Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ZoeyOS.App/ZoeyOS.App.csproj

      - name: Build
        run: dotnet build ZoeyOS.App/ZoeyOS.App.csproj --configuration Release --no-restore
