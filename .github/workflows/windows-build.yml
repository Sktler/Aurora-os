name: Aurora Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Aurora.sln

      - name: Build
        run: dotnet build Aurora.App/Aurora.App.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/AuroraUpdater.Tests/AuroraUpdater.Tests.csproj --configuration Release --no-restore
