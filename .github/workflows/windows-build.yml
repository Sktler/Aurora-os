name: Aurora Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, 'codex/demo-*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore Aurora.sln

      - name: Build
        run: dotnet build Aurora.App/Aurora.App.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/AuroraUpdater.Tests/AuroraUpdater.Tests.csproj --configuration Release --no-restore

      - name: WPF menu rendering regression
        run: dotnet run --project tests/MenuThemeChecks/MenuThemeChecks.csproj --configuration Release -- .

      - name: Save presentation check images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-presentation-checks
          path: artifacts/menu-theme/after
          if-no-files-found: ignore
