name: Aurora Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Android build configuration
        run: dotnet run --project tests/AndroidBuildChecks/AndroidBuildChecks.csproj -- .

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore Aurora.Android/Aurora.Android.csproj

      - name: Publish Android APK
        run: dotnet publish Aurora.Android/Aurora.Android.csproj --configuration Release --framework net10.0-android -p:AndroidPackageFormat=apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android-apk
          path: Aurora.Android/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Aurora.Android/bin/Release/net10.0-android/**/*.apk

  android-compatibility:
    name: Android API ${{ matrix.api-level }} smoke test
    needs: build-android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: aurora-android-apk
          path: artifacts

      - name: Start emulator and exercise APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            apk="$(find artifacts -name '*.apk' -type f | head -n 1)"
            test -n "$apk"
            adb install "$apk"
            adb shell pm revoke com.sktler.aurora android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm revoke com.sktler.aurora android.permission.ACCESS_FINE_LOCATION || true
            adb shell am force-stop com.sktler.aurora
            adb shell monkey -p com.sktler.aurora -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.sktler.aurora
            adb shell input keyevent 3
            sleep 2
            adb shell monkey -p com.sktler.aurora -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell pidof com.sktler.aurora
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am force-stop com.sktler.aurora
            adb shell monkey -p com.sktler.aurora -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell pidof com.sktler.aurora
            adb shell dumpsys package com.sktler.aurora | grep -q 'versionName'
