name: Aurora Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Android build configuration
        run: dotnet run --project tests/AndroidBuildChecks/AndroidBuildChecks.csproj -- .

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore Aurora.Android/Aurora.Android.csproj

      - name: Build Android APK
        run: dotnet build Aurora.Android/Aurora.Android.csproj --configuration Release --framework net10.0-android -p:AndroidPackageFormat=apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android-apk
          path: Aurora.Android/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
